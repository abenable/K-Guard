# Builds the APKs on every pull request targeting main and on every merge into main.
name: Build APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only one build per branch at a time; a new push to the same PR cancels the old one.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Restore the signing keys from repo secrets. They are written outside the
      # workspace (where the build already looks), so they are never committed.
      - name: Restore signing keys
        env:
          KGUARD_KEYSTORE_BASE64: ${{ secrets.KGUARD_KEYSTORE_BASE64 }}
          KGUARD_STORE_PASSWORD: ${{ secrets.KGUARD_STORE_PASSWORD }}
          KGUARD_KEY_ALIAS: ${{ secrets.KGUARD_KEY_ALIAS }}
          KGUARD_KEY_PASSWORD: ${{ secrets.KGUARD_KEY_PASSWORD }}
          KGUARD_DEBUG_KEYSTORE_BASE64: ${{ secrets.KGUARD_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/keystores ~/.android
          echo "$KGUARD_KEYSTORE_BASE64" | base64 -d > ~/keystores/k-guard-release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$HOME/keystores/k-guard-release.keystore" "$KGUARD_STORE_PASSWORD" \
            "$KGUARD_KEY_ALIAS" "$KGUARD_KEY_PASSWORD" > ~/keystores/k-guard-release.properties
          chmod 600 ~/keystores/k-guard-release.*
          echo "$KGUARD_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build APKs and run unit tests
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

      - name: Verify the release APK's signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "DN:|SHA-256 digest"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: K-Guard-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: K-Guard-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
