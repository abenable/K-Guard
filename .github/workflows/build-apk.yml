# Builds the APKs on every pull request targeting main and on every merge into main.
name: Build APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only one build per branch at a time; a new push to the same PR cancels the old one.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs and run unit tests
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: K-Guard-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: K-Guard-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
